{% extends 'dashboard/base.html' %}

{% block content %}
<style>
@keyframes ob-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes ob-back{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.ob{max-width:520px;margin:0 auto;min-height:calc(100vh - 150px);display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;gap:14px;padding:4px 2px 18px}
.ob-back{width:38px;height:38px;border-radius:50%;background:#fff;color:#1d1d1f;display:flex;align-items:center;justify-content:center;font-size:14px;
  text-decoration:none;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px -4px rgba(0,0,0,.1);border:none;cursor:pointer}
.ob-bar{flex:1;height:6px;border-radius:99px;background:#e5e5ea;overflow:hidden}
.ob-bar i{display:block;height:100%;width:0;border-radius:99px;background:#1d1d1f;transition:width .4s ease}
.ob-count{font-size:13px;font-weight:600;color:#86868b;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.ob-stage{flex:1}
.ob-q{animation:ob-in .3s ease both}
.ob-q.back{animation-name:ob-back}
.ob-title{font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-0.04em;margin-top:6px}
.ob-sub{margin-top:8px;font-size:15px;color:#6e6e73}
.ob-opts{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.ob-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;border:2px solid transparent;cursor:pointer;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px -8px rgba(0,0,0,.07);transition:transform .12s,border-color .15s,background .15s;font-family:inherit;color:inherit}
.ob-opt:active{transform:scale(.985)}
.ob-opt .ic{width:42px;height:42px;border-radius:13px;background:#f5f5f7;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;transition:all .15s}
.ob-opt .tx{flex:1;min-width:0}
.ob-opt .tx b{display:block;font-size:16px;font-weight:600;letter-spacing:-0.02em;line-height:1.25}
.ob-opt .tx small{display:block;font-size:13px;color:#86868b;margin-top:2px}
.ob-opt .ck{width:22px;height:22px;border-radius:50%;border:2px solid #d1d1d6;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .15s}
.ob-opt.sel{border-color:#1d1d1f}
.ob-opt.sel .ic{background:#1d1d1f;color:#fff}
.ob-opt.sel .ck{background:#1d1d1f;border-color:#1d1d1f;color:#fff}
.ob-wait{text-align:center;padding:90px 20px;animation:ob-in .3s ease both}
.ob-wait .spin{width:46px;height:46px;border-radius:50%;border:4px solid #e5e5ea;border-top-color:#1d1d1f;margin:0 auto 18px;animation:ob-spin .8s linear infinite}
@keyframes ob-spin{to{transform:rotate(360deg)}}
.ob-wait b{font-size:20px;font-weight:700;letter-spacing:-0.03em}
.ob-wait p{margin-top:6px;font-size:14px;color:#86868b}
</style>

<div class="ob">
    <div class="ob-top">
        <a id="ob-back" class="ob-back" href="{% url 'welcome' %}" aria-label="Назад"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="ob-bar"><i id="ob-fill"></i></div>
        <span id="ob-count" class="ob-count"></span>
    </div>
    <div id="ob-stage" class="ob-stage"></div>
</div>

<form id="ob-form" method="POST" action="{% url 'onboarding_save' %}" style="display:none">
    {% csrf_token %}
    <input type="hidden" name="answers" id="ob-answers">
</form>

{{ questions|json_script:"q-data" }}

<script>
(function () {
    var Q = JSON.parse(document.getElementById('q-data').textContent);
    var KEY = 'streakly_ob_answers';
    var answers = {};
    try { answers = JSON.parse(sessionStorage.getItem(KEY) || '{}') || {}; } catch (e) { answers = {}; }

    // resume at the first unanswered question
    var i = 0;
    while (i < Q.length && answers[Q[i].id]) i++;
    if (i >= Q.length) i = Q.length - 1;

    var stage = document.getElementById('ob-stage');
    var fill = document.getElementById('ob-fill');
    var count = document.getElementById('ob-count');
    var backBtn = document.getElementById('ob-back');
    var busy = false;

    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
    }

    function render(isBack) {
        var q = Q[i];
        stage.textContent = '';
        fill.style.width = (i / Q.length * 100) + '%';
        count.textContent = (i + 1) + '/' + Q.length;

        var wrap = el('div', 'ob-q' + (isBack ? ' back' : ''));
        wrap.appendChild(el('h1', 'ob-title', q.title));
        if (q.sub) wrap.appendChild(el('p', 'ob-sub', q.sub));

        var list = el('div', 'ob-opts');
        q.options.forEach(function (o) {
            var b = el('button', 'ob-opt' + (answers[q.id] === o.id ? ' sel' : ''));
            b.type = 'button';
            var ic = el('span', 'ic'); var icon = el('i', 'fa-solid ' + o.icon); ic.appendChild(icon);
            var tx = el('span', 'tx'); tx.appendChild(el('b', '', o.label));
            if (o.hint) tx.appendChild(el('small', '', o.hint));
            var ck = el('span', 'ck'); ck.appendChild(el('i', 'fa-solid fa-check'));
            b.appendChild(ic); b.appendChild(tx); b.appendChild(ck);
            b.addEventListener('click', function () { choose(q, o, b, list); });
            list.appendChild(b);
        });
        wrap.appendChild(list);
        stage.appendChild(wrap);
        window.scrollTo({ top: 0 });
    }

    function choose(q, o, btn, list) {
        if (busy) return;
        busy = true;
        answers[q.id] = o.id;
        try { sessionStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {}
        Array.prototype.forEach.call(list.children, function (c) { c.classList.remove('sel'); });
        btn.classList.add('sel');
        setTimeout(function () {
            busy = false;
            if (i < Q.length - 1) { i++; render(false); } else { finish(); }
        }, 260);
    }

    function finish() {
        fill.style.width = '100%';
        stage.textContent = '';
        var w = el('div', 'ob-wait');
        w.appendChild(el('div', 'spin'));
        w.appendChild(el('b', '', 'Собираю твой план'));
        w.appendChild(el('p', '', 'Привычки, распорядок дня и первый челлендж'));
        stage.appendChild(w);
        document.getElementById('ob-answers').value = JSON.stringify(answers);
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        setTimeout(function () { document.getElementById('ob-form').submit(); }, 700);
    }

    backBtn.addEventListener('click', function (e) {
        if (i > 0) { e.preventDefault(); i--; render(true); }
    });

    render(false);
})();
</script>
{% endblock %}
