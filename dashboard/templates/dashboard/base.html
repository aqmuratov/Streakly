{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streakly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="{% static 'icon.svg' %}">
    
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen pb-24">
    

    <!-- Top Navigation -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-40 shadow-lg">
        <!-- Logotip -->
        <a href="{% url 'habits' %}" class="flex items-center space-x-3">
            <img src="{% static 'icon.svg' %}" alt="" class="w-8 h-8">
            <span class="text-xl font-bold tracking-wide">Streakly<span class="text-indigo-500"></span></span>
        </a>

        <!-- O'ng tarafdagi foydalanuvchi ma'lumotlari va tugmalar -->
        {% if request.user.is_authenticated %}
        <div class="flex items-center space-x-4">
            <!-- Level va XP -->
            <div class="bg-slate-700/50 px-3 py-1.5 rounded-full border border-slate-600 flex items-center space-x-2 text-xs sm:text-sm">
                Lvl {{ user.profile.level }}
<span>⚡ {{ user.profile.total_xp }} XP</span>
            </div>

            <!-- Foydalanuvchi nomi -->
            <span class="text-slate-300 text-sm font-medium hidden sm:inline-block">
                👤 {{ request.user.username }}
            </span>

            <!-- Chiqish (Logout) -->
            <a href="{% url 'logout' %}" class="text-xs bg-slate-700 hover:bg-rose-600/20 hover:text-rose-400 text-slate-300 border border-slate-600 px-3 py-1.5 rounded-lg transition font-medium">
                Выйти
            </a>
        </div>
        {% else %}
        <!-- Login qilmagan bo'lsa kirish tugmalari -->
        <div class="flex items-center space-x-3 text-xs font-medium">
            <a href="{% url 'login' %}" class="text-slate-300 hover:text-white transition">Войти</a>
            <a href="{% url 'register' %}" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition">Регистрация</a>
        </div>
        {% endif %}
    </nav>

    <!-- Main Content Area -->
    <div class="max-w-3xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 px-4 py-3 z-50 flex justify-around items-center shadow-2xl">
        <a href="{% url 'challenges' %}" class="flex flex-col items-center transition {% if request.resolver_match.url_name == 'habits' %}text-indigo-400 font-bold{% else %}text-slate-400 hover:text-indigo-300{% endif %}">
    <i class="fa-solid fa-flag-checkered text-xl mb-1"></i>
    <span class="text-xs font-medium">Челленджи</span>
</a>
        <a href="{% url 'habits' %}" class="flex flex-col items-center transition {% if request.resolver_match.url_name == 'habits' %}text-indigo-400 font-bold{% else %}text-slate-400 hover:text-indigo-300{% endif %}">
            <i class="fa-solid fa-calendar-check text-xl mb-1"></i>
            <span class="text-xs font-medium">Привычки</span>
        </a>
        <a href="{% url 'tasks' %}" class="flex flex-col items-center transition {% if request.resolver_match.url_name == 'tasks' %}text-indigo-400 font-bold{% else %}text-slate-400 hover:text-indigo-300{% endif %}">
            <i class="fa-solid fa-list-check text-xl mb-1"></i>
            <span class="text-xs font-medium">Задачи</span>
        </a>
        <a href="{% url 'timer' %}" class="flex flex-col items-center transition {% if request.resolver_match.url_name == 'timer' %}text-indigo-400 font-bold{% else %}text-slate-400 hover:text-indigo-300{% endif %}">
            <i class="fa-solid fa-clock text-xl mb-1"></i>
            <span class="text-xs font-medium">Таймер</span>
        </a>
        <a href="{% url 'stats' %}" class="flex flex-col items-center transition {% if request.resolver_match.url_name == 'account' %}text-indigo-400 font-bold{% else %}text-slate-400 hover:text-indigo-300{% endif %}">
    <i class="fa-solid fa-chart-column text-xl mb-1"></i> Статистика
</a>
        <a href="{% url 'account' %}" class="flex flex-col items-center transition {% if request.resolver_match.url_name == 'account' %}text-indigo-400 font-bold{% else %}text-slate-400 hover:text-indigo-300{% endif %}">
            <i class="fa-solid fa-user text-xl mb-1"></i>
            <span class="text-xs font-medium">Профиль</span>
        </a>
    </div>

</body>
</html>
