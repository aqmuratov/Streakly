{% extends 'dashboard/base.html' %}

{% block content %}
<style>
@keyframes au-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.au{max-width:420px;margin:0 auto;padding:10px 4px 30px;animation:au-rise .5s ease both}
.au-back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#6e6e73;text-decoration:none;font-weight:500;margin-bottom:18px}
.au-title{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-0.04em}
.au-sub{margin-top:8px;font-size:15px;color:#6e6e73;line-height:1.45}
.au-card{margin-top:22px;background:#fff;border-radius:24px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px -8px rgba(0,0,0,.08)}
.au-card label{display:block;font-size:12px;font-weight:600;color:#86868b;margin:14px 2px 6px}
.au-card label:first-child{margin-top:0}
.au-fld{width:100%;background:#f5f5f7;border:1px solid transparent;border-radius:14px;padding:14px;font-size:16px;color:#1d1d1f;font-family:inherit;-webkit-appearance:none;appearance:none}
.au-fld:focus{border-color:#1d1d1f;background:#fff;outline:none}
.au-err{margin-bottom:14px;padding:12px 14px;border-radius:14px;background:#fff1f0;color:#d70015;font-size:13px;line-height:1.45}
.au-btn{width:100%;margin-top:20px;border:none;cursor:pointer;background:#1d1d1f;color:#fff;border-radius:99px;padding:16px;font-size:17px;font-weight:600;font-family:inherit;transition:transform .15s}
.au-btn:active{transform:scale(.98)}
.au-link{display:block;text-align:center;margin-top:18px;font-size:15px;color:#6e6e73;text-decoration:none;font-weight:500}
.au-link b{color:#1d1d1f}
</style>

<div class="au">
    <a href="{% url 'welcome' %}" class="au-back"><i class="fa-solid fa-chevron-left"></i> Назад</a>
    <h1 class="au-title">С возвращением</h1>
    <p class="au-sub">Войди, чтобы продолжить серию.</p>

    <form method="POST" class="au-card">
        {% csrf_token %}

        {% if form.errors %}
        <div class="au-err">Неверный логин или пароль. Проверь данные и попробуй ещё раз.</div>
        {% endif %}

        <label for="id_username">Логин</label>
        <input class="au-fld" id="id_username" type="text" name="username" required value="{{ form.username.value|default:'' }}" autocomplete="username" autocapitalize="none" autofocus>

        <label for="id_password">Пароль</label>
        <input class="au-fld" id="id_password" type="password" name="password" required autocomplete="current-password">

        <button type="submit" class="au-btn">Войти</button>
    </form>

    <a href="{% url 'onboarding' %}" class="au-link">Впервые здесь? <b>Составить свой план</b></a>
</div>
{% endblock %}
